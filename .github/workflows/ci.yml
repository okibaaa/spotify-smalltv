name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Firmware (PlatformIO)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: platformio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Prepare config.h
        run: cp include/config.example.h include/config.h

      - name: Build firmware
        run: pio run

      - name: Upload firmware.bin
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: firmware/.pio/build/smalltv-ultra/firmware.bin
          if-no-files-found: error

  daemon:
    name: Daemon (pytest + smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: daemon/pyproject.toml

      - name: Install daemon
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -q

      - name: Smoke test (demo API)
        working-directory: .
        run: bash scripts/smoke-test.sh
        env:
          PYTHON: python
