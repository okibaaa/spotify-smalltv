; PlatformIO project for GeekMagic SmallTV-Ultra
; ESP8266 (ESP-12E) + ST7789V 240x240
;
; TFT_eSPI のピン設定は build_flags で直接定義しています。
; 実機の配線に合わせて変更してください。

[env:smalltv-ultra]
platform = espressif8266@^4.2.1
board = esp12e
framework = arduino
board_build.f_cpu = 160000000L
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time
upload_speed = 115200

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=0
    -DTFT_RST=2
    -DTFT_BL=5
    -DTFT_BACKLIGHT_ON=LOW
    -DTFT_INVERSION_ON=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
